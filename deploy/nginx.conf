# nginx.conf — NamaMedical reverse proxy
# Route:
#   /            -> :3000  (main ERP, Express)
#   /api/v4/dept -> :3210  (dept registry)
#   /mynama      -> :3220  (patient portal)
#   /health      -> :3000/health (proxy main ERP)
#
# TLS termination here; backend never sees raw cert traffic.
# CSP stays report-only on backend (rail 8); this adds browser-side caching rules.

upstream nama_main     { server 127.0.0.1:3000; keepalive 32; }
upstream nama_dept_api { server 127.0.0.1:3210; keepalive 16; }
upstream nama_mynama   { server 127.0.0.1:3220; keepalive 16; }

server {
  listen 443 ssl http2;
  server_name jumanasoft.com www.jumanasoft.com;

  ssl_certificate     /etc/letsencrypt/live/jumanasoft.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jumanasoft.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # CSP report-only — promote to enforce after Phase G (§2.4 approval)
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; report-uri /csp-report" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  client_max_body_size 25m;

  # Patient portal (MyNama) — own location
  location /mynama/ {
    proxy_pass http://nama_mynama/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Dept API (REST, machine-readable)
  location /api/v4/dept/ {
    proxy_pass http://nama_dept_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # CSP report collector (also handled by main)
  location /csp-report {
    proxy_pass http://nama_main/csp-report;
  }

  # Main ERP
  location / {
    proxy_pass http://nama_main;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    proxy_buffering off;
  }

  # Health endpoint — short cache for monitoring, full for ops
  location = /health {
    proxy_pass http://nama_main/health;
    access_log off;
    add_header Cache-Control "no-store" always;
  }

  location = /api/v4/dept/health {
    proxy_pass http://nama_dept_api/health;
    access_log off;
    add_header Cache-Control "no-store" always;
  }
}

server {
  listen 80;
  server_name jumanasoft.com www.jumanasoft.com;
  return 301 https://$host$request_uri;
}
