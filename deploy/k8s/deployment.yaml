apiVersion: apps/v1
kind: Deployment
metadata:
  name: nama-medical-erp
  namespace: nama
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nama-medical-erp
  template:
    metadata:
      labels:
        app: nama-medical-erp
    spec:
      containers:
        - name: erp
          image: registry.jumanasoft.com/nama-medical-erp:20.0.0
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: RLS_FORCE
              value: "150"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nama-medical-erp
  namespace: nama
spec:
  selector:
    app: nama-medical-erp
  ports:
    - port: 80
      targetPort: 3000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nama-medical-erp
  namespace: nama
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nama-medical-erp
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
