name: deploy-hetzner-sftp

on:
  push:
    branches:
      - audit/phase-1a-critical-remediation
      - main
      - integration/all-epics
      - feat/waveA-subagent
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to deploy'
        required: false
        default: 'audit/phase-1a-critical-remediation'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-hetzner
      cancel-in-progress: false

    steps:
      - name: Checkout (full repo, submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SSH key for Hetzner
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HETZNER_SSH_KEY }}
          known_hosts: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: SCP entire namaweb tree to Hetzner
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          target: "/var/www/namaweb/"
          source: "namaweb/"
          strip_components: 1
          command_timeout: 15m

      - name: Apply DB migrations on Hetzner
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo ">>> Restarting pm2"
            cd /var/www/namaweb
            pm2 reload nama-medical-erp || pm2 restart nama-medical-erp
            sleep 8
            pm2 status nama-medical-erp

      - name: Smoke test against live
        shell: bash
        run: |
          set -euo pipefail
          echo ">>> Probing live endpoints"
          FAIL=0
          for ep in / /departments/cardiology.html /api/cardiology/score/grace /api/oncology/score/tnm /api/emergency/score/esi /api/pediatrics/score/apgar /api/surgery/score/asa /api/pharmacy/check-interaction /api/pulmonology/score/copd /api/gi/score/ucmayo /api/rheumatology/score/das28 /api/orthopedics/score/harris /api/neurology/score/nihss /api/nephrology/score/gfr; do
            CODE=$(curl -sS -m 12 -o /dev/null -w "%{http_code}" "https://jumanasoft.com$ep" || echo "000")
            echo "  $ep -> HTTP $CODE"
            case $CODE in
              000) FAIL=1 ;;
              404) case $ep in
                /|/departments/*) echo "    (404 ok for static page test on root path)" ;;
                *) FAIL=1 ;;
              esac ;;
            esac
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Smoke failed"
            exit 1
          fi
          echo ">>> All smoke probes OK"

      - name: Roll back on smoke failure
        if: failure()
        shell: bash
        run: |
          echo "::error::Deploy smoke failed. Manual rollback required:"
          echo "  ssh ubuntu@204.168.144.74 'cd /var/www/namaweb && pm2 restart nama-medical-erp'"
