name: ci

on:
  pull_request:
    branches: [ main, 'integration/*' ]
  push:
    branches: [ 'integration/*' ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd namaweb && npm ci --no-audit --no-fund
      - run: cd namaweb && npm run lint || true

  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd namaweb && npm ci --no-audit --no-fund
      - run: cd namaweb && DEPLOY_TARGET=dry-run DEPT_SMOKE_PORT=3211 npm test -- --runInBand

  compliance-settings:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd namaweb && npm ci --no-audit --no-fund
      - run: cd namaweb && npm run test:compliance:full

  test-rails:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd namaweb && npm ci --no-audit --no-fund
      - run: cd namaweb && DEPLOY_TARGET=dry-run npx jest tests/cross_tenant --runInBand

  migrate-validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd namaweb && npm ci --no-audit --no-fund
      - run: cd namaweb && DEPLOY_TARGET=dry-run node scripts/apply_all_tier1_migrations.js

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
