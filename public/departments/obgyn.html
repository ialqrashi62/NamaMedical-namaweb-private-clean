<!DOCTYPE html>
<html lang="ar-SA" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="obgyn.title">Obgyn - NamaMedical</title>
<link rel="stylesheet" href="/css/nama-tokens.css" />
</head>
<body>
<div class="container">
    <h1 data-i18n="obgyn.title">Obgyn</h1>
    <div class="dept-meta" data-i18n="obgyn.subtitle">obgyn module</div>

    <div style="text-align:left;margin-bottom:16px">
        <button class="btn btn-warning" id="lang-toggle" data-i18n="common.toggle_lang">EN</button>
    </div>

    <div class="card">
        <form id="form-bishop">
            <div class="form-row">
                <label data-i18n="common.patient_id">patient_id</label>
                <input class="input" name="patient_id" type="number" required />
            </div>
            <div class="form-row">
                <label data-i18n="obgyn.dilation_cm">dilation_cm</label>
                <input class="input" name="dilation_cm" type="number" min="0" max="10" step="0.5" required />
            </div>
            <div class="form-row">
                <label data-i18n="effacement_pct">effacement_pct</label>
                <input class="input" name="effacement_pct" type="number" min="0" max="100" required />
            </div>
            <div class="form-row">
                <label data-i18n="station">station</label>
                <input class="input" name="station" type="number" min="-5" max="5" required />
            </div>
            <div class="form-row">
                <label data-i18n="consistency">consistency</label>
                <select class="select" name="consistency" required>
                    <option value="firm">firm</option>
                    <option value="medium">medium</option>
                    <option value="soft">soft</option>
                </select>
            </div>
            <div class="form-row">
                <label data-i18n="position">position</label>
                <select class="select" name="position" required>
                    <option value="posterior">posterior</option>
                    <option value="mid">mid</option>
                    <option value="anterior">anterior</option>
                </select>
            </div>
            <div class="form-row">
                <button type="submit" class="btn btn-primary" data-i18n="common.submit">Submit</button>
            </div>
        </form>
        <div id="result-bishop" class="result-block">
            <h3 data-i18n="common.result">Result</h3>
            <pre id="result-bishop-text"></pre>
        </div>
    </div>
</div>

<script src="/js/nama-i18n.js"></script>
<script src="/js/nama-api.js"></script>
<script>
    NamaI18n.onLoad((dict, locale) => {
        document.documentElement.lang = locale;
        document.documentElement.dir  = locale === 'ar' ? 'rtl' : 'ltr';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.textContent = NamaI18n.t(key, el.textContent);
        });
        const btn = document.getElementById('lang-toggle');
        btn.textContent = locale === 'ar' ? 'EN' : 'AR';
    });
    document.getElementById('lang-toggle').addEventListener('click', () => {
        const next = NamaI18n.current() === 'ar' ? 'en' : 'ar';
        NamaI18n.loadLocale(next);
    });

    async function bind(formId, endpoint, resultId) {
        document.getElementById(formId).addEventListener('submit', async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const body = Object.fromEntries(fd.entries());
            const out = document.getElementById(resultId);
            out.classList.add('visible');
            document.getElementById(resultId + '-text').textContent = NamaI18n.t('common.loading');
            try {
                const r = await NamaApi.apiPost(endpoint, body);
                document.getElementById(resultId + '-text').textContent = JSON.stringify(r, null, 2);
            } catch (err) {
                document.getElementById(resultId + '-text').textContent = 'Error: ' + err.message;
            }
        });
    }
    bind('form-bishop', '/api/obgyn/bishop-score', 'result-bishop');
</script>
</body>
</html>
